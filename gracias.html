<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Gracias! — Te Lo Dije</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Spectral:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{
    margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:#3A1140; color:#FBF7EC;
    font-family:'Spectral', serif;
    padding:24px;
  }
  .card{
    max-width:460px; text-align:center;
    background:#F1E9D2; color:#2A1830;
    border-radius:8px; padding:38px 30px;
    box-shadow:0 18px 40px rgba(0,0,0,0.35);
  }
  h1{font-family:'Anton', sans-serif; font-weight:400; font-size:1.7rem; color:#3A1140; margin:0 0 14px;}
  p{font-size:0.98rem; color:#5A4A5F; margin:0 0 8px;}
  .status{
    margin-top:20px; padding:14px; border-radius:6px;
    background:#E4D8B4; font-size:0.9rem;
  }
  a{color:#5C1B57;}
</style>
</head>
<body>
  <div class="card">
    <h1>¡Pago recibido!</h1>
    <p>Tu carta está en proceso. En cuanto se confirme, se manda a imprimir y enviar por correo automáticamente — no tienes que hacer nada más.</p>
    <div class="status" id="status">Consultando el estado de tu pedido…</div>
  </div>

  <script>
    const BACKEND_URL = 'https://telodije-ec7f.onrender.com';
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order');
    const statusEl = document.getElementById('status');

    const labels = {
      pending: 'Esperando confirmación del pago…',
      paid: 'Pago confirmado — preparando el envío a imprenta…',
      sent: '✅ Tu carta ya fue enviada a imprimir y correo.',
      error: '⚠️ Hubo un problema al enviarla. Nos encargamos de revisarlo.',
    };

    async function checkStatus(){
      if(!orderId){ statusEl.textContent = 'No se encontró el número de pedido.'; return; }
      try {
        const res = await fetch(`${BACKEND_URL}/api/order/${orderId}`);
        const data = await res.json();
        if(!res.ok){ statusEl.textContent = 'No se encontró tu pedido.'; return; }
        statusEl.textContent = `${labels[data.status] || data.status} (Exp. ${data.expNumber})`;
        if(data.status === 'pending' || data.status === 'paid'){
          setTimeout(checkStatus, 3000); // sigue consultando hasta que quede "sent" o "error"
        }
      } catch (err) {
        statusEl.textContent = 'No se pudo conectar con el servidor para confirmar el estado.';
      }
    }
    checkStatus();
  </script>
</body>
</html>
