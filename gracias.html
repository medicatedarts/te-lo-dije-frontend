<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Gracias! — Te Lo Dije</title>
<style>
  @font-face{font-family:'Anton'; font-style:normal; font-weight:400; font-display:swap; src:url('anton-400.woff2') format('woff2');}
  @font-face{font-family:'Spectral'; font-style:normal; font-weight:400; font-display:swap; src:url('spectral-400.woff2') format('woff2');}
  @font-face{font-family:'Spectral'; font-style:normal; font-weight:600; font-display:swap; src:url('spectral-600.woff2') format('woff2');}

  body{
    margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:#3A1140; color:#FBF7EC;
    font-family:'Spectral', serif;
    padding:24px;
  }
  .card{
    max-width:460px; text-align:center;
    background:#F1E9D2; color:#2A1830;
    border-radius:8px; padding:38px 30px;
    box-shadow:0 18px 40px rgba(0,0,0,0.35);
  }
  h1{font-family:'Anton', sans-serif; font-weight:400; font-size:1.7rem; color:#3A1140; margin:0 0 14px;}
  p{font-size:0.98rem; color:#5A4A5F; margin:0 0 8px;}
  .status{
    margin-top:20px; padding:14px; border-radius:6px;
    background:#E4D8B4; font-size:0.9rem;
  }
  a{color:#5C1B57;}
  .actions{margin-top:24px;}
  .btn{
    display:inline-block;
    background:#3A1140;
    color:#FBF7EC;
    font-family:'Anton', sans-serif;
    letter-spacing:0.02em;
    font-size:0.95rem;
    padding:12px 22px;
    border-radius:3px;
    text-decoration:none;
    border:none;
    cursor:pointer;
  }
  .auto-redirect{
    margin-top:14px;
    font-size:0.8rem;
    color:#8A7A8F;
  }
  .auto-redirect.hidden{display:none;}
</style>
</head>
<body>
  <div class="card">
    <h1>¡Pago recibido!</h1>
    <p>Tu carta está en proceso. En cuanto se confirme, se manda a imprimir y enviar por correo automáticamente — no tienes que hacer nada más.</p>
    <div class="status" id="status" aria-live="polite">Consultando el estado de tu pedido…</div>

    <div class="actions">
      <a class="btn" href="index.html">Enviar otra carta</a>
    </div>
    <p class="auto-redirect hidden" id="auto-redirect" aria-live="polite"></p>
  </div>

  <script>
    const BACKEND_URL = 'https://te-lo-dije-backend.onrender.com';
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order');
    const statusEl = document.getElementById('status');
    const autoRedirectEl = document.getElementById('auto-redirect');

    const labels = {
      pending: 'Esperando confirmación del pago…',
      paid: 'Pago confirmado — preparando el envío a imprenta…',
      sent: '✅ Tu carta ya fue enviada a imprimir y correo.',
      error: '⚠️ Hubo un problema al enviarla. Nos encargamos de revisarlo.',
    };

    // Estados finales: cuando llegamos aquí dejamos de consultar y
    // arrancamos la cuenta regresiva para regresar al formulario.
    const TERMINAL_STATES = ['sent', 'error'];

    function startAutoRedirect(seconds = 10){
      autoRedirectEl.classList.remove('hidden');
      let remaining = seconds;
      autoRedirectEl.textContent = `Volviendo al inicio en ${remaining}s…`;
      const interval = setInterval(() => {
        remaining -= 1;
        if(remaining <= 0){
          clearInterval(interval);
          window.location.href = 'index.html';
          return;
        }
        autoRedirectEl.textContent = `Volviendo al inicio en ${remaining}s…`;
      }, 1000);
    }

    async function checkStatus(){
      if(!orderId){ statusEl.textContent = 'No se encontró el número de pedido.'; return; }
      try {
        const res = await fetch(`${BACKEND_URL}/api/order/${orderId}`);
        const data = await res.json();
        if(!res.ok){ statusEl.textContent = 'No se encontró tu pedido.'; return; }
        statusEl.textContent = `${labels[data.status] || data.status} (Exp. ${data.expNumber})`;
        if(TERMINAL_STATES.includes(data.status)){
          startAutoRedirect(10);
        } else {
          setTimeout(checkStatus, 3000); // sigue consultando hasta que quede "sent" o "error"
        }
      } catch (err) {
        statusEl.textContent = 'No se pudo conectar con el servidor para confirmar el estado.';
      }
    }
    checkStatus();
  </script>
</body>
</html>
